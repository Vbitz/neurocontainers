name: romeo
version: 3.2.8

copyright:
  - license: MIT
    url: https://github.com/korbinian90/ROMEO.jl/blob/master/LICENSE

architectures:
  - x86_64
  - aarch64

auto_update:
  method: github_release
  repo: korbinian90/ROMEO

build:
  kind: neurodocker

  base-image: ubuntu:20.04
  pkg-manager: apt

  directives:
    - install:
        - curl
        - ca-certificates

    - condition: arch == "x86_64"
      workdir: /opt/romeo-{{ context.version }}/

    - condition: arch == "x86_64"
      run:
        - tar -xz -C /opt/romeo-{{ context.version }}/ --strip-components 1 -f {{ get_file("romeo_linux_3_2_8_tar_gz") }}

    - condition: arch == "aarch64"
      install:
        - libatomic1

    - condition: arch == "aarch64"
      run:
        - mkdir -p /opt/romeo-{{ context.version }}/bin
        - tar -xzf {{ get_file("julia_aarch64_tar_gz") }} -C /opt
        - ln -s /opt/julia-1.9.4 /opt/julia
        - tar -xzf {{ get_file("romeo_julia_source_tar_gz") }} -C /opt/romeo-{{ context.version }} --strip-components 1
        - /opt/julia/bin/julia --project=/opt/romeo-{{ context.version }} -e 'using Pkg; Pkg.add(["ArgParse", "MriResearchTools"]); Pkg.precompile()'
        - printf '%s\n' '#!/usr/bin/env bash' 'if [ "$#" -eq 1 ] && [ "$1" = "--version" ]; then echo "v3.2.8 (ROMEO.jl v1.6.0)"; exit 0; fi' 'exec /opt/julia/bin/julia --project=/opt/romeo-3.2.8 /opt/romeo-3.2.8/romeo.jl "$@"' > /opt/romeo-{{ context.version }}/bin/romeo
        - chmod 0755 /opt/romeo-{{ context.version }}/bin/romeo

    - condition: arch == "x86_64"
      environment:
        PATH: /opt/romeo-{{ context.version }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:~/.local/bin

    - condition: arch == "aarch64"
      environment:
        PATH: /opt/julia/bin:/opt/romeo-{{ context.version }}/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:~/.local/bin

deploy:
  path:
    - /opt/romeo-{{ context.version }}/bin

readme: |
  ----------------------------------
  ## romeo/{{ context.version }} ##
  Unwrapping of 3D and 4D datasets. Coil combination of 5D datasets.



  Example:
  ```
  ROMEO is a command line application.

  Example usage for single-echo or multiple time points with identical echo time (fMRI):
  $ romeo ph.nii -m mag.ii -k nomask -o outputdir

  Example usage for a 3-echo Scan with TE = [3,6,9] ms:
  $ romeo ph.nii -m mag.ii -k nomask -t [3,6,9] -o outputdir

  Note that echo times are required for unwrapping multi-echo data.
  ```

  More documentation can be found here: https://github.com/korbinian90/ROMEO

  To run applications outside of this container: ml romeo/{{ context.version }}

  Citation:
  ```
  ROMEO: Dymerska, B., Eckstein, K., Bachrata, B., Siow, B., Trattnig, S., Shmueli, K., Robinson, S.D., 2020. Phase Unwrapping with a Rapid Opensource Minimum Spanning TreE AlgOrithm (ROMEO). Magnetic Resonance in Medicine. https://doi.org/10.1002/mrm.28563

  MCPC-3D-S Coil Combination: Eckstein, K., Dymerska, B., Bachrata, B., Bogner, W., Poljanc, K., Trattnig, S., Robinson, S.D., 2018. Computationally Efficient Combination of Multi-channel Phase Data From Multi-echo Acquisitions (ASPIRE). Magnetic Resonance in Medicine 79, 2996\u20133006. https://doi.org/10.1002/mrm.26963
  ```

  ----------------------------------

categories:
  - "phase processing"
icon: data:image/png;base64,

files:
  - name: romeo_linux_3_2_8_tar_gz
    url: https://github.com/korbinian90/ROMEO/releases/download/v{{ context.version }}/romeo_linux_{{ context.version }}.tar.gz
  - name: romeo_julia_source_tar_gz
    condition: arch == "aarch64"
    url: https://github.com/korbinian90/ROMEO.jl/archive/refs/tags/v1.6.0.tar.gz
    sha256: 1c29b2417e1534ee276d429fa6686fb3ebc1e963094c8dffccae6d74436df3f0
  - name: julia_aarch64_tar_gz
    condition: arch == "aarch64"
    url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.9/julia-1.9.4-linux-aarch64.tar.gz
    sha256: 541d0c5a9378f8d2fc384bb8595fc6ffe20d61054629a6e314fb2f8dfe2f2ade
