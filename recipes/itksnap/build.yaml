name: itksnap
version: 4.4.0
# make sure to update the download link below: https://www.itksnap.org/pmwiki/pmwiki.php?n=Downloads.SNAP4
# they started including the build date: e.g. 20241202
architectures:
  - x86_64
  - aarch64

variables:
  itksnap_source_version: 4.4.0-beta2
  itksnap_source_revision: 1ebe25defacf051fd9f4d4f0f93b748138c92716
  itk_version: 5.4.3
  vtk_version: 9.3.1
  c3d_revision: d4d963629d7dfdca4b0607907f0e91827c22ea2a
  greedy_revision: 2d5dfa1891ac726524495d4ca8a3461be86c12f5
  digestible_revision: 1b66709e99c43d280bb472e1a0e36185ef2ea412
structured_readme:
  description: |
    itksnap is an image viewer for DICOM and NII files and supports manual segmentation of data.
  example: itksnap
  documentation: http://www.itksnap.org/pmwiki/pmwiki.php
  citation: 'Paul A. Yushkevich, Joseph Piven, Heather Cody Hazlett, Rachel Gimpel Smith, Sean Ho, James C. Gee, and Guido Gerig. User-guided 3D active contour segmentation of anatomical structures: Significantly improved efficiency and reliability. Neuroimage 2006 Jul 1;31(3):1116-28.'
auto_update:
  method: webpage
  url: https://www.itksnap.org/pmwiki/pmwiki.php?n=Main.Downloads
  version_regex: <h3>ITK-SNAP (?P<version>\d+\.\d+\.\d+) \(LATEST RELEASE\)</h3>

build:
  kind: neurodocker
  base-image: ubuntu:24.04
  pkg-manager: apt
  directives:
    - install: curl ca-certificates unzip binutils libqt5gui5 libopengl0 libxcb-cursor0 libxcb-cursor-dev
    - condition: arch == "x86_64"
      workdir: /opt/itksnap-{{ context.version }}
    - condition: arch == "x86_64"
      run:
        - cp {{ get_file("MRI_crop_zip") }} /example_data.zip
        - unzip /example_data.zip
        - rm /example_data.zip
        - tar -xz --strip-components=1 -C /opt/itksnap-{{ context.version }} -f {{ get_file("downloaded_tar_file") }}
    - condition: arch == "x86_64"
      environment:
        QT_QPA_PLATFORM: xcb
        PATH: $PATH:/opt/itksnap-{{ context.version }}/bin
    - condition: arch == "aarch64"
      install:
        - build-essential
        - cmake
        - file
        - git
        - libcurl4-openssl-dev
        - libfontconfig1-dev
        - libfreetype6-dev
        - libgl1-mesa-dev
        - libglu1-mesa-dev
        - libqt6opengl6-dev
        - libssh-dev
        - libx11-dev
        - libx11-xcb-dev
        - libxcb-cursor-dev
        - libxcb-image0-dev
        - libxcb-icccm4-dev
        - libxcb-keysyms1-dev
        - libxcb-render-util0-dev
        - libxcb-xinerama0-dev
        - libxcb-xkb-dev
        - libxext-dev
        - libxfixes-dev
        - libxi-dev
        - libxkbcommon-dev
        - libxkbcommon-x11-dev
        - libxrender-dev
        - libxtst-dev
        - ninja-build
        - qt6-base-dev
        - qt6-declarative-dev
        - qt6-tools-dev
        - qt6-tools-dev-tools
        - zlib1g-dev
    - condition: arch == "aarch64"
      workdir: /opt/itksnap
    - condition: arch == "aarch64"
      environment:
        QT_QPA_PLATFORM: xcb
        PATH: $PATH:/usr/local/bin
    - condition: arch == "aarch64"
      run:
        - mkdir -p /opt/itksnap/source /opt/itksnap/itk /opt/itksnap/vtk
        - tar -xzf {{ get_file("itksnap_source") }} -C /opt/itksnap/source --strip-components=1
        - git -C /opt/itksnap/source init -q
        - git -C /opt/itksnap/source config user.email arm64-build@localhost
        - git -C /opt/itksnap/source config user.name arm64-build
        - git -C /opt/itksnap/source commit --allow-empty -q -m "Build source archive"
        - python3 -c 'import base64; from pathlib import Path; p=Path("/opt/itksnap/source/CMakeLists.txt"); s=p.read_text(); old=base64.b64decode("cXRfYWRkX3RyYW5zbGF0aW9ucygKICBUQVJHRVRTICR7U05BUF9CVU5ETEVfTkFNRX0KICBTT1VSQ0VfVEFSR0VUUyBpdGtzbmFwdWlfcXQgJHtTTkFQX0JVTkRMRV9OQU1FfQogIFRTX0ZJTEVfRElSIEdVSS9RdC9UcmFuc2xhdGlvbnMKICBUU19GSUxFX0JBU0UgaXRrc25hcAop").decode(); new=base64.b64decode("").decode(); assert old in s; s=s.replace(old,new,1); old=base64.b64decode("").decode(); new=base64.b64decode("ICAjIFF0IDYuNCBpbiBVYnVudHUgMjQuMDQgaGFzIG5vIGRlcGxveW1lbnQtc2NyaXB0IEFQSTsgc3lzdGVtIFF0IHBsdWdpbnMgYXJlIHVzZWQuCg==").decode(); assert old in s; p.write_text(s.replace(old,new,1))'
        - python3 -c 'from pathlib import Path; p=Path("/opt/itksnap/source/GUI/Qt/Components/SSHTunnelWorkerThread.cxx"); s=p.read_text(); assert s.count("<< message;")==2; s=s.replace("<< message;", "<< QString::fromStdString(message);"); a="<< ready_info.hostname <<"; b="<< QString::fromStdString(ready_info.hostname) <<"; assert a in s; p.write_text(s.replace(a,b,1)); p=Path("/opt/itksnap/source/GUI/Qt/Components/SNAPQtCommon.cxx"); s=p.read_text(); a="#include <QDateTime>"+chr(10); assert a in s; p.write_text(s.replace(a,a+"#include <QTimeZone>"+chr(10),1))'
        - python3 -c 'from pathlib import Path; p=Path("/opt/itksnap/source/GUI/Qt/Windows/DeepLearningServerPanel.cxx"); s=p.read_text(); a="#include <QInputDialog>"+chr(10); assert a in s; s=s.replace(a,a+"#include <QDialogButtonBox>"+chr(10),1); a="<< p->GetHostname() <<"; b="<< QString::fromStdString(p->GetHostname()) <<"; assert a in s; p.write_text(s.replace(a,b,1))'
        - python3 -c 'import functools; from pathlib import Path; p=Path("/opt/itksnap/source/Testing/GUI/Qt/SSHTunnelTest/main.cxx"); s=p.read_text(); replacements=(("<< message;", "<< QString::fromStdString(message);"), ("<< ready_info.hostname <<", "<< QString::fromStdString(ready_info.hostname) <<")); assert all(a in s for a, _ in replacements); s=functools.reduce(lambda value, pair: value.replace(pair[0], pair[1], 1), replacements, s); p.write_text(s)'
        - mkdir -p /opt/itksnap/source/Submodules/c3d /opt/itksnap/source/Submodules/greedy /opt/itksnap/source/Submodules/digestible
        - tar -xzf {{ get_file("c3d_source") }} -C /opt/itksnap/source/Submodules/c3d --strip-components=1
        - tar -xzf {{ get_file("greedy_source") }} -C /opt/itksnap/source/Submodules/greedy --strip-components=1
        - tar -xzf {{ get_file("digestible_source") }} -C /opt/itksnap/source/Submodules/digestible --strip-components=1
        - tar -xzf {{ get_file("itk_source") }} -C /opt/itksnap/itk --strip-components=1
        - cmake -S /opt/itksnap/itk -B /opt/itksnap/itk-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/itksnap/itk-install -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DModule_MorphologicalContourInterpolation=ON
        - cmake --build /opt/itksnap/itk-build --parallel
        - cmake --install /opt/itksnap/itk-build
        - tar -xzf {{ get_file("vtk_source") }} -C /opt/itksnap/vtk --strip-components=1
        - cmake -S /opt/itksnap/vtk -B /opt/itksnap/vtk-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/itksnap/vtk-install -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DVTK_RENDERING_BACKEND=OpenGL2 -DVTK_GROUP_ENABLE_Qt=YES -DVTK_MODULE_ENABLE_VTK_RenderingExternal=YES -DVTK_MODULE_ENABLE_VTK_GUISupportQtQuick=NO -DVTK_MODULE_ENABLE_VTK_GUISupportQtSQL=NO -DCMAKE_PREFIX_PATH=/usr/lib/aarch64-linux-gnu/cmake/Qt6
        - cmake --build /opt/itksnap/vtk-build --parallel
        - cmake --install /opt/itksnap/vtk-build
        - cmake -S /opt/itksnap/source -B /opt/itksnap/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/itksnap/install -DBUILD_TESTING=OFF -DITK_DIR=/opt/itksnap/itk-install/lib/cmake/ITK-5.4 -DVTK_DIR=/opt/itksnap/vtk-install/lib/cmake/vtk-9.3
        - cmake --build /opt/itksnap/build --parallel
        - cmake --install /opt/itksnap/build
        - install -m 0755 /opt/itksnap/install/lib/snap-{{ context.itksnap_source_version }}/ITK-SNAP /usr/local/bin/itksnap
        - install -m 0755 /opt/itksnap/install/bin/c3d /usr/local/bin/c3d
        - install -m 0755 /opt/itksnap/install/bin/c3d_affine_tool /usr/local/bin/c3d_affine_tool
        - install -m 0755 /opt/itksnap/install/bin/greedy /usr/local/bin/greedy
    - deploy:
        bins:
          - itksnap
          - greedy 
          - c3d
          - c3d_affine_tool
icon: data:image/png;base64,
gui_apps:
  - name: "itksnapGUI"
    exec: "itksnap"
categories:
  - visualization
readme: |-
  ----------------------------------
  ## itksnap/{{ context.version }} ##

  itksnap is an image viewer for DICOM and NII files and supports manual segmentation of data.

  Example:
  ```
  itksnap
  ```

  More documentation can be found here: http://www.itksnap.org/pmwiki/pmwiki.php

  Citation:
  ```
  Paul A. Yushkevich, Joseph Piven, Heather Cody Hazlett, Rachel Gimpel Smith, Sean Ho, James C. Gee, and Guido Gerig. User-guided 3D active contour segmentation of anatomical structures: Significantly improved efficiency and reliability. Neuroimage 2006 Jul 1;31(3):1116-28.
  ```

  To run container outside of this environment: ml itksnap/{{ context.version }}

  ----------------------------------
copyright:
  - license: LGPL-3.0-only
    url: https://github.com/pyushkevich/itksnap?tab=GPL-3.0-1-ov-file#readme


# # Troubleshooting:
# export QT_QPA_PLATFORM=wayland
# export QT_DEBUG_PLUGINS=1
# itksnap
# apt update
# apt install -y mlocate
# updatedb
# locate libQt6Core.so.6
files:
  - name: downloaded_tar_file
    condition: arch == "x86_64"
    url: https://sourceforge.net/projects/itk-snap/files/itk-snap/{{ context.version }}/itksnap-{{ context.version }}-20250909-Linux-x86_64.tar.gz
  - name: MRI_crop_zip
    condition: arch == "x86_64"
    url: https://www.nitrc.org/frs/download.php/750/MRI-crop.zip
  - name: itksnap_source
    condition: arch == "aarch64"
    url: https://github.com/pyushkevich/itksnap/archive/{{ context.itksnap_source_revision }}.tar.gz
  - name: c3d_source
    condition: arch == "aarch64"
    url: https://github.com/pyushkevich/c3d/archive/{{ context.c3d_revision }}.tar.gz
  - name: greedy_source
    condition: arch == "aarch64"
    url: https://github.com/pyushkevich/greedy/archive/{{ context.greedy_revision }}.tar.gz
  - name: digestible_source
    condition: arch == "aarch64"
    url: https://github.com/pyushkevich/digestible/archive/{{ context.digestible_revision }}.tar.gz
  - name: itk_source
    condition: arch == "aarch64"
    url: https://github.com/InsightSoftwareConsortium/ITK/releases/download/v{{ context.itk_version }}/InsightToolkit-{{ context.itk_version }}.tar.gz
  - name: vtk_source
    condition: arch == "aarch64"
    url: https://github.com/Kitware/VTK/archive/refs/tags/v{{ context.vtk_version }}.tar.gz
