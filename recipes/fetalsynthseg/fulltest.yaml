name: fetalsynthseg
version: 1.0.0
default_timeout: 120

tests:
  - name: fetalsynthseg launcher available
    description: Verify the fetalsynthseg inference launcher is deployed on PATH.
    command: command -v fetalsynthseg
    expected_output_contains: fetalsynthseg
  - name: fetalsynthseg help
    description: Verify the inference entrypoint runs and prints its usage.
    command: fetalsynthseg --help

  - name: fetalsynthseg runtime dependencies
    description: Verify the packaged inference dependencies import successfully.
    command: python3 -c "import torch, monai; print('FetalSynthSeg runtime imports OK')"
    expected_output_contains: FetalSynthSeg runtime imports OK
