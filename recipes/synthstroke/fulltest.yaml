name: synthstroke
version: 0.0.0
tests:
- name: SynthStroke launcher
  command: synthstroke --help
  expected_exit_code: 0
  expected_output_contains: --input
- name: download launcher
  command: command -v synthstroke-download
  expected_exit_code: 0
  expected_output_contains: synthstroke-download
- name: bundled baseline inference
  command: |
    python - <<'PY'
    import nibabel as nib
    import numpy as np

    image = np.zeros((128, 128, 128), dtype=np.float32)
    nib.save(nib.Nifti1Image(image, np.eye(4)), "test_input.nii.gz")
    PY
    synthstroke --input test_input.nii.gz --outdir test_output/baseline
  validate:
    - output_exists: test_output/baseline/prediction_lesion_mask.nii.gz
